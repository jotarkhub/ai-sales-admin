name: Laravel CI

# Sumber bukti utama bahwa kode AI Sales Admin benar-benar bisa dieksekusi.
# Jangan tandai modul apa pun "selesai" tanpa run CI ini berwarna hijau.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ai_sales_admin_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_TIMEZONE: Asia/Jakarta
      APP_LOCALE: id
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ai_sales_admin_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, sqlite3, bcmath, intl, xml, curl, zip, gd, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json / composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Clear cached configuration
        run: php artisan optimize:clear

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 20); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent && break
            echo "Menunggu MySQL siap... ($i)"
            sleep 3
          done

      - name: Run fresh migrations
        run: php artisan migrate:fresh --force

      - name: Run automated tests
        run: php artisan test

      - name: Check code style (Laravel Pint)
        run: vendor/bin/pint --test
